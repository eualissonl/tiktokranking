<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mundial de Pilotos F1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d10;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding:22px 10px 40px}
.container{width:100%;max-width:480px;margin:auto}
.header{background:#14171d;border:1px solid #292f39;border-radius:16px;padding:17px 10px;text-align:center;margin-bottom:20px}
.header h1{font-size:23px;color:#ffd900;font-weight:900}
.header p{margin-top:7px;font-size:13px;color:#aab4c5}
#status{text-align:center;font-size:12px;color:#7e8a9d;margin-bottom:12px;min-height:16px}
#status:empty{display:none}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:20px}
.podium-card{background:#171b23;border:1px solid #343b47;border-radius:15px;min-height:220px;padding:16px 7px 12px;text-align:center;display:flex;flex-direction:column;justify-content:center;position:relative}
.podium-card.first{border-color:#ffe000;background:linear-gradient(180deg,rgba(255,216,0,.13),#171b23 65%);min-height:245px}
.podium-card.second{border-color:#bfc5cc}.podium-card.third{border-color:#e48a22}
.crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:30px}
.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;border:2px solid #414956;background:#292e38}
.first .avatar{border-color:#ffe000;box-shadow:0 0 10px rgba(255,224,0,.35)}
.second .avatar{border-color:#9ca4af}.third .avatar{border-color:#d47b1d}
.podium-position{font-size:12px;color:#aab2c0;margin-bottom:6px}
.podium-name{font-size:14px;font-weight:800;color:#fff;word-break:break-word;min-height:34px;display:flex;align-items:center;justify-content:center}
.podium-points{margin-top:7px;font-size:18px;font-weight:900;color:#00eaff}
.podium-wins{font-size:11px;color:#9ba5b6;margin-top:5px}
.ranking-box{background:#11151b;border:1px solid #292f39;border-radius:16px;padding:10px}
.ranking-title{text-align:center;color:#fff;font-size:15px;font-weight:900;padding:8px 0 12px}
.ranking-list{display:flex;flex-direction:column;gap:2px}
.ranking-row{min-height:74px;background:#191e26;border-radius:11px;display:flex;align-items:center;padding:9px 10px;gap:9px}
.ranking-row:hover{background:#202630}
.position{width:30px;text-align:center;color:#9ba7b9;font-size:14px;font-weight:900;flex-shrink:0}
.top1{color:#ffd900}.top2{color:#c8cdd3}.top3{color:#e08b30}
.ranking-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#303641;border:1px solid #454d5a;flex-shrink:0}
.player-info{flex:1;min-width:0}.player-name{color:#fff;font-size:13px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.player-wins{color:#7f8a9c;font-size:10px;margin-top:4px}
.player-points{text-align:right;flex-shrink:0}.points{color:#00eaff;font-size:15px;font-weight:900}.points-label{color:#728095;font-size:9px;margin-top:3px}
.message{text-align:center;padding:35px 15px;color:#8792a4;font-size:13px}.error{color:#ff6b6b}
.refresh-area{text-align:center;margin-top:15px}
#refreshBtn{background:#171b22;border:1px solid #343b47;color:#cbd3df;border-radius:9px;padding:9px 18px;cursor:pointer;font-size:12px;font-weight:700}
#refreshBtn:disabled{opacity:.5;cursor:default}
@media(max-width:380px){.header h1{font-size:20px}.podium{gap:6px}.podium-card{padding-left:3px;padding-right:3px}.avatar{width:62px;height:62px}.podium-name{font-size:11px}.podium-points{font-size:16px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏆 MUNDIAL DE PILOTOS F1</h1>
    <p>Campeonato Oficial de Seguidores</p>
  </div>

  <div id="status">Carregando ranking...</div>
  <div id="podium" class="podium"></div>

  <div class="ranking-box">
    <div class="ranking-title">🏁 RANKING GERAL</div>
    <div id="rankingList" class="ranking-list">
      <div class="message">Carregando pilotos...</div>
    </div>
  </div>

  <div class="refresh-area">
    <button id="refreshBtn" onclick="loadRanking()">🔄 Atualizar ranking</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://pdrkrltchoglgtnjprio.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_9yvlW94LVk_toqNBnz4N1w_Smbpdqva";
  
const podium=document.getElementById("podium");
const rankingList=document.getElementById("rankingList");
const statusEl=document.getElementById("status");
const refreshBtn=document.getElementById("refreshBtn");

function escapeHTML(value){
  return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function defaultAvatar(username){
  return `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(username||"Piloto")}`;
}
function getAvatar(p){
  return p.avatar_url&&String(p.avatar_url).trim()?p.avatar_url:defaultAvatar(p.username);
}

async function loadRanking(){
  refreshBtn.disabled=true;
  statusEl.textContent="🏁 Atualizando ranking...";
  rankingList.innerHTML='<div class="message">Carregando pilotos...</div>';
  podium.innerHTML="";

  try{
    const url=SUPABASE_URL+"/rest/v1/leaderboard?select=username,avatar_url,points,wins&order=points.desc,wins.desc,username.asc";
    const response=await fetch(url,{
      cache:"no-store",
      headers:{ apikey:SUPABASE_ANON_KEY }
    });

    const text=await response.text();
    let data;
    try{data=text?JSON.parse(text):null}catch{data=text}

    if(!response.ok){
      throw new Error(`HTTP ${response.status}: ${typeof data==="string"?data:JSON.stringify(data)}`);
    }

    const seen=new Set();
    const players=[];

    for(const p of Array.isArray(data)?data:[]){
      const username=String(p.username||"").trim();
      if(!username)continue;
      const key=username.toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      players.push({
        username,
        avatar_url:p.avatar_url||"",
        points:Number(p.points)||0,
        wins:Number(p.wins)||0
      });
    }

    players.sort((a,b)=>{
      if(b.points!==a.points)return b.points-a.points;
      if(b.wins!==a.wins)return b.wins-a.wins;
      return a.username.localeCompare(b.username);
    });

    if(!players.length){
      rankingList.innerHTML='<div class="message">🏁 Nenhum piloto no ranking ainda.</div>';
      statusEl.textContent="Nenhum resultado encontrado.";
      return;
    }

    renderPodium(players);
    renderRanking(players);

    statusEl.textContent="";
  }catch(error){
    console.error("Erro ao carregar ranking:",error);
    statusEl.textContent="❌ Erro ao carregar ranking.";
    rankingList.innerHTML=`<div class="message error">❌ Não foi possível carregar o ranking.<br><br>${escapeHTML(error.message)}</div>`;
  }finally{
    refreshBtn.disabled=false;
  }
}

function renderPodium(players){
  const items=[
    {player:players[1],position:2,className:"second"},
    {player:players[0],position:1,className:"first"},
    {player:players[2],position:3,className:"third"}
  ];

  podium.innerHTML=items.filter(x=>x.player).map(x=>{
    const p=x.player;
    const avatar=escapeHTML(getAvatar(p));
    const fallback=escapeHTML(defaultAvatar(p.username));
    return `
      <div class="podium-card ${x.className}">
        ${x.position===1?'<div class="crown">👑</div>':""}
        <img class="avatar" src="${avatar}" alt=""
          onerror="this.onerror=null;this.src='${fallback}'">
        <div class="podium-position">${x.position}º</div>
        <div class="podium-name">${escapeHTML(p.username)}</div>
        <div class="podium-points">${p.points} pts</div>
        <div class="podium-wins">🏁 ${p.wins} ${p.wins===1?"vitória":"vitórias"}</div>
      </div>`;
  }).join("");
}

function renderRanking(players){
  rankingList.innerHTML=players.map((p,i)=>{
    const pos=i+1;
    const cls=pos===1?"top1":pos===2?"top2":pos===3?"top3":"";
    const avatar=escapeHTML(getAvatar(p));
    const fallback=escapeHTML(defaultAvatar(p.username));
    return `
      <div class="ranking-row">
        <div class="position ${cls}">${pos}º</div>
        <img class="ranking-avatar" src="${avatar}" alt="" loading="lazy"
          onerror="this.onerror=null;this.src='${fallback}'">
        <div class="player-info">
          <div class="player-name">${escapeHTML(p.username)}</div>
          <div class="player-wins">🏁 ${p.wins} ${p.wins===1?"vitória":"vitórias"}</div>
        </div>
        <div class="player-points">
          <div class="points">${p.points} pts</div>
          <div class="points-label">PONTOS</div>
        </div>
      </div>`;
  }).join("");
}

loadRanking();
setInterval(loadRanking,30000);
</script>
</body>
</html>
