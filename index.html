<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mundial de Pilotos F1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0d10;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding: 22px 10px 40px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    .header {
      background: #14171d;
      border: 1px solid #292f39;
      border-radius: 16px;
      padding: 17px 10px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .header h1 {
      font-size: 23px;
      color: #ffd900;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .header p {
      margin-top: 7px;
      font-size: 13px;
      color: #aab4c5;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      text-align: center;
      font-size: 12px;
      color: #7e8a9d;
      margin-bottom: 12px;
      min-height: 16px;
    }

    /* =========================
       PÓDIO
    ========================= */

    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items: end;
      margin-bottom: 20px;
    }

    .podium-card {
      background: #171b23;
      border: 1px solid #343b47;
      border-radius: 15px;
      min-height: 180px;
      padding: 14px 6px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .podium-card.first {
      border-color: #ffe000;
      background: linear-gradient(
        180deg,
        rgba(255,216,0,.13),
        #171b23 65%
      );
      min-height: 195px;
    }

    .podium-card.second {
      border-color: #bfc5cc;
    }

    .podium-card.third {
      border-color: #e48a22;
    }

    .crown {
      position: absolute;
      top: -17px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 25px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 9px;
      border: 2px solid #414956;
      background: #292e38;
    }

    .first .avatar {
      border-color: #ffe000;
      box-shadow: 0 0 10px rgba(255,224,0,.35);
    }

    .second .avatar {
      border-color: #9ca4af;
    }

    .third .avatar {
      border-color: #d47b1d;
    }

    .podium-position {
      font-size: 11px;
      color: #aab2c0;
      margin-bottom: 5px;
    }

    .podium-name {
      font-size: 12px;
      font-weight: 800;
      color: white;
      word-break: break-word;
      min-height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .podium-points {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 900;
      color: #00eaff;
    }

    .podium-wins {
      font-size: 10px;
      color: #9ba5b6;
      margin-top: 4px;
    }

    /* =========================
       RANKING
    ========================= */

    .ranking-box {
      background: #11151b;
      border: 1px solid #292f39;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    .ranking-title {
      text-align: center;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      padding: 8px 0 12px;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ranking-row {
      min-height: 74px;
      background: #191e26;
      border-radius: 11px;
      display: flex;
      align-items: center;
      padding: 9px 10px;
      gap: 9px;
    }

    .ranking-row:hover {
      background: #202630;
    }

    .position {
      width: 30px;
      text-align: center;
      color: #9ba7b9;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .position.top1 {
      color: #ffd900;
    }

    .position.top2 {
      color: #c8cdd3;
    }

    .position.top3 {
      color: #e08b30;
    }

    .ranking-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #303641;
      border: 1px solid #454d5a;
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      color: white;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-wins {
      color: #7f8a9c;
      font-size: 10px;
      margin-top: 4px;
    }

    .player-points {
      text-align: right;
      flex-shrink: 0;
    }

    .points {
      color: #00eaff;
      font-size: 15px;
      font-weight: 900;
    }

    .points-label {
      color: #728095;
      font-size: 9px;
      margin-top: 3px;
    }

    /* =========================
       VAZIO / ERRO
    ========================= */

    .message {
      text-align: center;
      padding: 35px 15px;
      color: #8792a4;
      font-size: 13px;
    }

    .error {
      color: #ff6b6b;
    }

    /* =========================
       BOTÃO ATUALIZAR
    ========================= */

    .refresh-area {
      text-align: center;
      margin-top: 15px;
    }

    #refreshBtn {
      background: #171b22;
      border: 1px solid #343b47;
      color: #cbd3df;
      border-radius: 9px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    #refreshBtn:hover {
      background: #222832;
    }

    #refreshBtn:disabled {
      opacity: .5;
      cursor: default;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 380px) {
      .header h1 {
        font-size: 20px;
      }

      .podium {
        gap: 6px;
      }

      .podium-card {
        padding-left: 3px;
        padding-right: 3px;
      }

      .podium-name {
        font-size: 10px;
      }

      .podium-points {
        font-size: 14px;
      }

      .ranking-row {
        padding-left: 6px;
        padding-right: 6px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- CABEÇALHO -->
  <div class="header">
    <h1>🏆 MUNDIAL DE PILOTOS F1</h1>
    <p>Campeonato Oficial de Seguidores</p>
  </div>

  <div id="status">Carregando ranking...</div>

  <!-- PÓDIO -->
  <div id="podium" class="podium"></div>

  <!-- RANKING -->
  <div class="ranking-box">

    <div class="ranking-title">
      🏁 RANKING GERAL
    </div>

    <div id="rankingList" class="ranking-list">
      <div class="message">
        Carregando pilotos...
      </div>
    </div>

  </div>

  <!-- ATUALIZAR -->
  <div class="refresh-area">
    <button id="refreshBtn" onclick="loadRanking()">
      🔄 Atualizar ranking
    </button>
  </div>

</div>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://pdrkrltchoglgtnjprio.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_9yvlW94LVk_toqNBnz4N1w_Smbpdqva";


  /* ==========================================
     ELEMENTOS
  ========================================== */

  const podium = document.getElementById("podium");
  const rankingList = document.getElementById("rankingList");
  const statusEl = document.getElementById("status");
  const refreshBtn = document.getElementById("refreshBtn");


  /* ==========================================
     AVATAR PADRÃO
  ========================================== */

  function defaultAvatar(username) {

    const name = encodeURIComponent(
      username || "Piloto"
    );

    return `https://api.dicebear.com/9.x/initials/svg?seed=${name}`;

  }


  /* ==========================================
     ESCAPAR HTML
  ========================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     FORMATAR AVATAR
  ========================================== */

  function getAvatar(player) {

    if (
      player.avatar_url &&
      typeof player.avatar_url === "string" &&
      player.avatar_url.trim() !== ""
    ) {
      return player.avatar_url;
    }

    return defaultAvatar(player.username);

  }


  /* ==========================================
     REQUISIÇÃO SUPABASE
  ========================================== */

  async function supabaseRequest(url) {

    const response = await fetch(url, {

      method: "GET",

      headers: {

        "apikey": SUPABASE_ANON_KEY,

        "Authorization":
          `Bearer ${SUPABASE_ANON_KEY}`,

        "Content-Type":
          "application/json"

      }

    });

    const text = await response.text();

    let data;

    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = text;
    }

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}: ${
          typeof data === "string"
            ? data
            : JSON.stringify(data)
        }`
      );

    }

    return data;

  }


  /* ==========================================
     CARREGAR RANKING
  ========================================== */

  async function loadRanking() {

    refreshBtn.disabled = true;

    statusEl.textContent =
      "🏁 Atualizando ranking...";

    rankingList.innerHTML = `
      <div class="message">
        Carregando pilotos...
      </div>
    `;

    podium.innerHTML = "";

    try {

      const url =
        `${SUPABASE_URL}/rest/v1/leaderboard` +
        `?select=username,avatar_url,points,wins` +
        `&order=points.desc,wins.desc,username.asc`;

      const players =
        await supabaseRequest(url);


      if (!Array.isArray(players)) {
        throw new Error(
          "Resposta inválida do Supabase."
        );
      }


      /* ======================================
         PODERIA HAVER DUPLICADOS
         Mantém apenas uma linha por username.
      ====================================== */

      const uniquePlayers = [];

      const seen = new Set();

      for (const player of players) {

        const username =
          String(player.username || "")
            .trim();

        if (!username) continue;

        const key =
          username.toLowerCase();

        if (seen.has(key)) continue;

        seen.add(key);

        uniquePlayers.push({

          username,

          avatar_url:
            player.avatar_url || "",

          points:
            Number(player.points) || 0,

          wins:
            Number(player.wins) || 0

        });

      }


      /* ======================================
         ORDENAR
      ====================================== */

      uniquePlayers.sort((a, b) => {

        if (b.points !== a.points) {
          return b.points - a.points;
        }

        if (b.wins !== a.wins) {
          return b.wins - a.wins;
        }

        return a.username.localeCompare(
          b.username
        );

      });


      /* ======================================
         NENHUM PILOTO
      ====================================== */

      if (uniquePlayers.length === 0) {

        rankingList.innerHTML = `
          <div class="message">
            🏁 Nenhum piloto no ranking ainda.
          </div>
        `;

        statusEl.textContent =
          "Nenhum resultado encontrado.";

        return;
      }


      /* ======================================
         PÓDIO
      ====================================== */

      renderPodium(uniquePlayers);


      /* ======================================
         LISTA COMPLETA
      ====================================== */

      renderRanking(uniquePlayers);


      statusEl.textContent =
        `🏁 ${uniquePlayers.length} piloto${
          uniquePlayers.length === 1 ? "" : "s"
        } no campeonato`;

    }

    catch (error) {

      console.error(
        "Erro ao carregar ranking:",
        error
      );

      statusEl.textContent =
        "❌ Erro ao carregar ranking.";

      rankingList.innerHTML = `
        <div class="message error">
          ❌ Não foi possível carregar o ranking.<br><br>
          ${escapeHTML(error.message)}
        </div>
      `;

    }

    finally {

      refreshBtn.disabled = false;

    }

  }


  /* ==========================================
     RENDERIZAR PÓDIO
  ========================================== */

  function renderPodium(players) {

    const first = players[0];
    const second = players[1];
    const third = players[2];

    /*
      Ordem visual:
      2º | 1º | 3º
    */

    const podiumPlayers = [

      {
        player: second,
        position: 2,
        className: "second"
      },

      {
        player: first,
        position: 1,
        className: "first"
      },

      {
        player: third,
        position: 3,
        className: "third"
      }

    ];


    podium.innerHTML =
      podiumPlayers
        .filter(item => item.player)
        .map(item => {

          const player = item.player;

          const avatar =
            escapeHTML(getAvatar(player));

          const username =
            escapeHTML(player.username);

          const crown =
            item.position === 1
              ? `<div class="crown">👑</div>`
              : "";

          return `

            <div class="podium-card ${item.className}">

              ${crown}

              <img
                class="avatar"
                src="${avatar}"
                alt=""
                onerror="this.onerror=null;this.src='${defaultAvatar(player.username)}';"
              >

              <div class="podium-position">
                ${item.position}º
              </div>

              <div class="podium-name">
                ${username}
              </div>

              <div class="podium-points">
                ${player.points} pts
              </div>

              <div class="podium-wins">
                🏁 ${player.wins} ${
                  player.wins === 1
                    ? "vitória"
                    : "vitórias"
                }
              </div>

            </div>

          `;

        })
        .join("");

  }


  /* ==========================================
     RENDERIZAR LISTA
  ========================================== */

  function renderRanking(players) {

    rankingList.innerHTML =
      players.map((player, index) => {

        const position =
          index + 1;

        const avatar =
          escapeHTML(getAvatar(player));

        const username =
          escapeHTML(player.username);

        let positionClass = "";

        if (position === 1) {
          positionClass = "top1";
        }

        else if (position === 2) {
          positionClass = "top2";
        }

        else if (position === 3) {
          positionClass = "top3";
        }


        return `

          <div class="ranking-row">

            <div class="position ${positionClass}">
              ${position}º
            </div>

            <img
              class="ranking-avatar"
              src="${avatar}"
              alt=""
              loading="lazy"
              onerror="this.onerror=null;this.src='${defaultAvatar(player.username)}';"
            >

            <div class="player-info">

              <div class="player-name">
                ${username}
              </div>

              <div class="player-wins">
                🏁 ${player.wins} ${
                  player.wins === 1
                    ? "vitória"
                    : "vitórias"
                }
              </div>

            </div>

            <div class="player-points">

              <div class="points">
                ${player.points} pts
              </div>

              <div class="points-label">
                PONTOS
              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /* ==========================================
     ATUALIZAÇÃO AUTOMÁTICA
  ========================================== */

  loadRanking();

  /*
    Atualiza a cada 30 segundos.
  */

  setInterval(() => {

    loadRanking();

  }, 30000);

</script>

</body>
</html>
